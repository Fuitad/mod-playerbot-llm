[project]
name = "playerbots-llm"
version = "0.1.0"
description = "Provider-neutral generation sidecar for the mod-playerbots-llm AzerothCore module"
requires-python = ">=3.12"
dependencies = [
    "aiomysql[rsa]>=0.3.2",
    "anthropic==0.120.2",
    "pydantic>=2.7,<3",
]

[project.scripts]
playerbots-llm = "playerbots_llm.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "basedpyright>=1.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playerbots_llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "mysql: needs a disposable MySQL instance; run scripts/run_ledger_mysql_tests.sh",
]
# The mysql tests skip themselves without a DSN, but excluding them by default keeps a
# bare `pytest` honest about what it actually verified.
addopts = "-m 'not mysql'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
ignore = [
    "S101",  # assert is expected in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hard-coded test tokens are intentional

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
