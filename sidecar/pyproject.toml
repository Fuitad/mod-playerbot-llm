[project]
name = "playerbot-claude"
version = "0.1.0"
description = "Loopback Claude sidecar for the mod-playerbot-claude AzerothCore module"
requires-python = ">=3.12"
dependencies = [
    "anthropic==0.120.2",
    "pydantic>=2.7,<3",
]

[project.scripts]
playerbot-claude = "playerbot_claude.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "basedpyright>=1.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playerbot_claude"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
ignore = [
    "S101",  # assert is expected in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hard-coded test tokens are intentional

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
